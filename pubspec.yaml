name: bukuresipi_flutter
description: "Bukuresipi: recipes and places to eat from social media posts."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.18+20

environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  provider: ^6.1.5+1
  go_router: ^18.1.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  envied: ^1.3.10
  package_info_plus: ^10.2.2
  google_fonts: ^8.0.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  receive_sharing_intent: ^1.9.0
  flutter_inappwebview: 6.2.0-beta.3
  url_launcher: ^6.3.3
  maplibre_gl: ^0.27.1
  geolocator: ^14.1.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  google_sign_in: ^7.2.0
  firebase_analytics: ^13.0.1
  image_picker: ^1.2.4
  extended_image: ^10.1.0
  path_provider: ^2.1.6
  image_editor: ^1.6.0
  in_app_update: ^5.0.0
  google_mlkit_document_scanner: 0.6.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  envied_generator: ^1.3.10
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/images/
    - assets/badges/

# App icon + native splash from assets/brand (the website logo, bukuresipi-astro/public/favicon.svg).
# Regenerate: dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#2f6b3b"
  adaptive_icon_foreground: assets/brand/adaptive.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#2f6b3b"
  image: assets/brand/mark.png
  android_12:
    color: "#2f6b3b"
    image: assets/brand/mark.png
