name: bukuresipi_flutter
description: "Bukuresipi: recipes and places to eat from social media posts."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  provider: ^6.1.5+1
  go_router: ^18.1.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  envied: ^1.3.10
  package_info_plus: ^10.2.2
  google_fonts: ^8.0.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  envied_generator: ^1.3.10
  build_runner: ^2.16.2
flutter:
  uses-material-design: true
  generate: true
