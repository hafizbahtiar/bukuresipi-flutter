# Analyzer and every test, on each push and pull request. The generated files are git-ignored: .env comes from
# .env.example (public values only), then envied and the localizations are generated.
name: check
on:
  push:
    branches: [development, main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
