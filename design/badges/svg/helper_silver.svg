<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512">
<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.45" stop-color="#C9D0D9"/><stop offset="1" stop-color="#8A939F"/>
  </linearGradient>
  <linearGradient id="rim" x1="1" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#C9D0D9"/><stop offset="1" stop-color="#565E69"/>
  </linearGradient>
  <radialGradient id="face" cx="0.38" cy="0.32" r="0.8">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#C9D0D9"/><stop offset="1" stop-color="#8A939F"/>
  </radialGradient>
  <linearGradient id="struck" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8A939F"/><stop offset="1" stop-color="#565E69"/>
  </linearGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#20766B"/><stop offset="1" stop-color="#2A9D8F"/>
  </linearGradient>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.28"/>
  </filter>
</defs>
<!-- ribbon tails -->
