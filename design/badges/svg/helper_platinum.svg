<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512">
<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F4FFFE"/><stop offset="0.45" stop-color="#BFE3E0"/><stop offset="1" stop-color="#76A9A5"/>
  </linearGradient>
  <linearGradient id="rim" x1="1" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#F4FFFE"/><stop offset="0.5" stop-color="#BFE3E0"/><stop offset="1" stop-color="#3E6B68"/>
